experiments:
  - data_file: vanderpol_data.csv
    columns:
      - {name: time, units: s}
      - {name: x1, observes: x1}
      - {name: x2, observes: x2}

model:
  trainable_parameters:
    - {name: mu, min_val: 0.001, max_val: 100.0, logscale: true}
  integrated_variables:
    - {name: x1, init_val: 2.0}
    - {name: x2, init_val: 0.1}

population_opt:
  population_size: 100
  num_iters: 20
  processors: 8

gradient_opt:
  num_iters: 10
  stepsize_rtol: 1.0e-07
  stepsize_atol: 1.0e-09
  initial_timestep: 1.0e-06
  max_steps: 10000
  init_value_lr: 1.0e-04
  end_value_lr: 1.0e-05
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
