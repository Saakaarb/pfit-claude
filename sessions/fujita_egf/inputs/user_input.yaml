# EGF/EGFR -> Akt -> S6 signalling, Fujita et al., Sci. Signal. 3(132):ra56 (2010).
#
# Sixteen experiments: the same parameter set fitted simultaneously to six
# sustained EGF doses, the same six doses applied as a 60 s pulse, and four EGF
# ramp rates.
#
# The EGF stimulus differs per experiment but the framework passes no
# per-experiment scalars to the RHS, so the three stimulus descriptors are
# carried as zero-derivative states (EGF_0, EGF_rate, EGF_end) whose initial
# values are overridden per experiment. The RHS reconstructs
#     EGF(t) = EGF_0 + EGF_rate * t   for t <= EGF_end,   0 afterwards.
# For the step and ramp conditions EGF_end is the end of the record, so only
# the six pulse conditions actually switch, and they switch at t = 60 s -
# which is also a measurement time.
#
# Each CSV has columns:
#   0 time [s]
#   1-3  pEGFR_tot, pAkt_tot, pS6_tot   [a.u., scaled immunoblot intensity]
#   4-6  the per-point measurement standard deviations, same order

experiments:
  - data_file: step_00_1.csv
    columns:
      - {name: time, units: s}
      - {name: pEGFR, units: au, observes: obs_pEGFR}
      - {name: pAkt, units: au, observes: obs_pAkt}
      - {name: pS6, units: au, observes: obs_pS6}
      - {name: pEGFR_sd, units: au, uncertainty_of: pEGFR}
      - {name: pAkt_sd, units: au, uncertainty_of: pAkt}
      - {name: pS6_sd, units: au, uncertainty_of: pS6}
