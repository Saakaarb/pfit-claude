experiments:
  - data_file: data.csv
    columns:
      - {name: time, units: years}
      - {name: prevalence, units: percent, observes: prevalence}

model:
  trainable_parameters:
    - {name: rel_n, min_val: 0.1, max_val: 1000.0, logscale: true}
    - {name: beta_m, min_val: 1.0e-04, max_val: 1.0, logscale: true}
    - {name: rel_w, min_val: 0.1, max_val: 1000.0, logscale: true}
    - {name: tau_w, min_val: 1.0e-04, max_val: 1.0, logscale: true}
    - {name: w_n, min_val: 1.0e-04, max_val: 1.0, logscale: true}
    - {name: w_m, min_val: 1.0e-04, max_val: 1.0, logscale: true}
    - {name: g_m, min_val: 1.0e-04, max_val: 1.0, logscale: true}
    - {name: g_w, min_val: 1.0e-04, max_val: 1.0, logscale: true}
    - {name: bcr, min_val: 1.0e-09, max_val: 1.0e-05, logscale: true}
  fixed_parameters:
    - {name: Lambda, value: 1.032672e+06}
    - {name: f_t, value: 0.04}
    - {name: tau_n, value: 0.0}
    - {name: tau_m, value: 0.0}
    - {name: mu_S, value: 0.0288}
    - {name: mu_In, value: 0.0888}
    - {name: mu_Im, value: 0.1368}
    - {name: mu_Iw, value: 0.3108}
    - {name: mu_Tn, value: 0.0408}
    - {name: mu_Tm, value: 0.0528}
    - {name: mu_Tw, value: 0.1752}
  observables:
    - {name: prevalence}
  integrated_variables:
    - {name: S, init_val: 1.794e+07}
    - {name: In, init_val: 16300.0}
    - {name: Im, init_val: 9000.0}
    - {name: Iw, init_val: 11000.0}
    - {name: Tn, init_val: 0.0}
    - {name: Tm, init_val: 0.0}
    - {name: Tw, init_val: 0.0}

population_opt:
  population_size: 600
  num_iters: 30
  processors: 16
  algorithm: DE
  random_seed: 0
  stepsize_rtol: 1.0e-06
  stepsize_atol: 1.0e-01

gradient_opt:
  num_iters: 1000
  stepsize_rtol: 1.0e-08
  stepsize_atol: 1.0e-03
  initial_timestep: 1.0e-06
  initial_time: 0.0
  max_steps: 10000
  integrator: Kvaerno5
  gradient_optimizer: adam
  init_value_lr: 1.0e-03
  end_value_lr: 1.0e-05
  transition_steps_lr: 200
  decay_rate_lr: 0.9

output:
  write_results: true
