# Cascaded tanks with overflow - Schoukens, Mattsson, Wigren & Noel, Workshop on
# Nonlinear System Identification Benchmarks, Brussels 2016.
# Data: nonlinearbenchmark.org, dataBenchmark.csv (1024 points, Ts = 4 s).
#
# Water is pumped from a reservoir into an upper tank, flows through a small
# opening into a lower tank, and back to the reservoir. The input is the pump
# voltage; the output is the lower tank level.
#
#   dx1/dt = -k1*sqrt(x1) + k4*u(t)
#   dx2/dt =  k2*sqrt(x1) - k3*sqrt(x2)
#        y =  x2
#
# The benchmark's baseline model (its eqs 1-3), which deliberately does NOT
# model the overflow. When the input peaks, the upper tank overflows and part of
# the water bypasses into the lower tank; the level sensor also saturates at 10.
# Both records reach y = 10 exactly, so a systematic residual at the peaks is
# expected and is a property of the model, not of the fit.
#
# The pump voltage is an exogenous input, carried as data column 2 and
# interpolated inside the RHS at the solver's own time points. This is the first
# session to drive the RHS from a recorded signal rather than an analytic one.
#
# Only the estimation record is fitted. The benchmark's figure of merit is the
# RMSE of a free-running simulation on the validation record, which is a
# separate exercise and must not influence the fit; validation.csv is present
# but is deliberately NOT an experiment here.

experiments:
  - data_file: estimation.csv
    columns:
      - {name: time, units: s}
      - {name: level_lower, units: V, observes: x2}
      - {name: pump_voltage, units: V}

model:
  # The benchmark publishes no values for k1..k4, so these ranges are DERIVED
  # from the data, not known. The lower tank's relaxation rate is
  # d(dx2/dt)/dx2 = -k3/(2*sqrt(x2)); the multisine excites up to 0.0144 Hz, so
  # the fastest response the record can contain has a period of ~69 s, and with
  # x2 ~ 5 that gives k3 ~ 2*sqrt(5)/200 ~ 2e-02. A steady-state balance
  # k1*sqrt(x1) = k4*u with u ~ 3 puts k4 within a factor of a few of k1, and
  # k2*sqrt(x1) = k3*sqrt(x2) does the same for k2. The box below is four
  # decades centred an order of magnitude above that estimate, so every
  # parameter is bracketed with room on both sides. Flagged as derived.
  trainable_parameters:
    - {name: k1, min_val: 1.0e-03, max_val: 1.0e+01, logscale: true}
    - {name: k2, min_val: 1.0e-03, max_val: 1.0e+01, logscale: true}
    - {name: k3, min_val: 1.0e-03, max_val: 1.0e+01, logscale: true}
    - {name: k4, min_val: 1.0e-03, max_val: 1.0e+01, logscale: true}
  integrated_variables:
    # x2(0) is MEASURED: y = x2, so it is data row 0 of estimation.csv.
    # x1(0) is genuinely unknown - the benchmark lists "the unknown initial
    # values of the states" as one of its four challenges, and this framework
    # cannot fit an initial condition. It is set from the quasi-steady balance
    # k2*sqrt(x1) = k3*sqrt(x2), which for k2 ~ k3 gives x1 ~ x2. This is an
    # ASSUMPTION; if it is wrong the error appears as an initial transient that
    # no parameter can remove.
    - {name: x1, init_val: 5.0}
    - {name: x2, init_val: 5.205}

population_opt:
  population_size: 100
  num_iters: 30
  processors: 8
  algorithm: DE
  random_seed: 0
  stepsize_rtol: 1.0e-05
  stepsize_atol: 1.0e-07

gradient_opt:
  num_iters: 1000
  stepsize_rtol: 1.0e-07
  stepsize_atol: 1.0e-09
  # The problem's timescale is O(100 s), not O(1), so the usual 1e-06 first step
  # is needlessly small.
  initial_timestep: 1.0e-03
  initial_time: 0.0
  max_steps: 10000
  # Implicit, per R1 in generated/user_input_check.txt. The draft said Dopri5,
  # reasoning from the parameter values the data implies; the bounds are what
  # matter, and they admit a slaved fast mode. The triangular Jacobian's
  # eigenvalues are exactly -k1/(2*sqrt(x1)) and -k3/(2*sqrt(x2)); at the top of
  # the box the upper tank's timescale is 0.45 s against the data's tau_min of
  # 34 s, so an explicit method would be stability-limited to 1.2e+04 steps
  # where accuracy needs 120.
  integrator: Kvaerno5
  gradient_optimizer: adam
  init_value_lr: 1.0e-03
  end_value_lr: 1.0e-05
  transition_steps_lr: 200
  decay_rate_lr: 0.9

output:
  write_results: true
