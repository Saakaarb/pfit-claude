experiments:
  - data_file: robertson_data.csv
    columns:
      - {name: time, units: s}
      - {name: y1, units: mol/L, observes: y1}
      - {name: y2, units: mol/L, observes: y2}
      - {name: y3, units: mol/L, observes: y3}

model:
  trainable_parameters:
    - {name: k1, min_val: 0.001, max_val: 10.0, logscale: true}
    - {name: k2, min_val: 5.0e+03, max_val: 5.0e+10, logscale: true}
    - {name: k3, min_val: 1.0e+00, max_val: 1.0e+08, logscale: true}
  integrated_variables:
    - {name: y1, init_val: 1}
    - {name: y2, init_val: 0}
    - {name: y3, init_val: 0}

population_opt:
  population_size: 100
  num_iters: 20
  processors: 8
  stepsize_rtol: 1.0e-03
  stepsize_atol: [1.0e-03, 1.0e-08, 1.0e-04]

gradient_opt:
  num_iters: 10
  stepsize_rtol: 1.0e-07
  stepsize_atol: 1.0e-09
  initial_timestep: 1.0e-06
  max_steps: 10000
  init_value_lr: 1.0e-04
  end_value_lr: 1.0e-05
  transition_steps_lr: 2000
  decay_rate_lr: 0.9

output:
  write_results: true
